name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set Pages base path
        run: |
          BASE_NAME="${GITHUB_REPOSITORY#*/}"
          if [[ "$BASE_NAME" == *.github.io ]]; then
            echo "GHP_BASE=/" >> "$GITHUB_ENV"
          else
            echo "GHP_BASE=/${BASE_NAME}/" >> "$GITHUB_ENV"
          fi

      - name: Validate and build for production
        run: npm run pre-deploy
        env:
          VITE_ENV: production
          GHP_BASE: ${{ env.GHP_BASE }}

      - name: Install browser for release checks
        run: npx playwright install --with-deps chromium

      - name: Verify final Pages build in desktop and mobile browsers
        run: npm run test:e2e

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pages-browser-failures
          path: test-results/
          if-no-files-found: ignore

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
